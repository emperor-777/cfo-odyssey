label { font-size: 13px; color: #8ba2b3; text-transform: uppercase; letter-spacing: 1px; }

button{cursor:pointer;width:100%;border-radius:2px;background:#0f151c;border:1px solid #5d7380;color:#dbe4ea;padding:12px 14px;font:700 15px Rajdhani,sans-serif;letter-spacing:2px;box-shadow:none;transition:all .2s ease;text-transform:uppercase}

.sel-card .name { font-weight: bold; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #ece6d6; }
.sel-card .desc { font-size: 11px; color: #7f99ac; margin-top: 4px; line-height: 1.3;}

#hud{position:fixed;left:20px;top:calc(env(safe-area-inset-top,0px) + 20px);font-size:14px;display:none;min-width:220px;background:rgba(5,8,12,0.8);padding:14px;border:1px solid #5d738055;border-left:3px solid #d9a441;border-radius:0;font-family:'IBM Plex Mono',monospace; box-shadow: 0 4px 20px rgba(0,0,0,0.5);}
.bar{height:12px;background:#111;border-radius:2px;overflow:hidden;margin:6px 0 10px; border: 1px solid #333;}
#hb{height:100%;width:100%;background:linear-gradient(90deg,#c0392b,#d9a441); transition: width 0.3s ease;}
#mn{position:fixed;top:20px;width:100%;text-align:center;font-size:14px;letter-spacing:4px;color:#d9a441;pointer-events:none;font-family:'IBM Plex Mono',monospace; text-shadow: 0 0 10px rgba(217, 164, 65, 0.4);}
#hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:100%;text-align:center;font-size:13px;color:#aef;pointer-events:none;text-shadow:0 2px 4px #000;font-family:'IBM Plex Mono',monospace; letter-spacing: 1px;}
.lb{position:fixed;pointer-events:none;transform:translate(-50%,-100%);text-align:center;font-size:11px;color:#dbe4ea;text-shadow:0 1px 3px #000;white-space:nowrap;font-family:'IBM Plex Mono',monospace; border-bottom:1px solid #d9a441;padding-bottom:4px;letter-spacing:1px; background: rgba(0,0,0,0.4); padding: 4px 8px;}
#fl{position:fixed;inset:0;background:#f22;opacity:0;pointer-events:none}
.row{display:flex;align-items:center;gap:12px;font:12px 'IBM Plex Mono',monospace;margin:8px 0; background: rgba(255,255,255,0.02); padding: 4px; border-radius: 2px;}
.row span:first-child{width:160px; color: #dbe4ea; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}.row .bar{flex:1;margin:0; height: 8px;}
.row i{display:block;height:100%; transition: width 0.5s ease;}
.ok{color:#7fbf8f; text-shadow: 0 0 10px rgba(127, 191, 143, 0.3);}.no{color:#e0605a; text-shadow: 0 0 10px rgba(224, 96, 90, 0.3);}

.loader { border: 3px solid #333; border-top: 3px solid #d9a441; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 10px; display: none;}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

const CHARACTERS = [

let selectedCharId = 'c1';

// Stars + nebula

g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));

[[0x5522aa,-300,100,-700],[0x0a6a8a,350,-80,-800],[0x3a1a4a, -100, -200, -500]].forEach(([c,x,y,z])=>{
    const m=new THREE.Mesh(new THREE.SphereGeometry(260,16,16),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.15,fog:false, blending: THREE.AdditiveBlending}));

});

const stk=new THREE.Group();stk.visible=false;S.add(stk);
for(let i=0;i<200;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.06,.06,14),new THREE.MeshBasicMaterial({color:i%3?0x9fdfff:0xffffff,fog:false}));m.position.set((Math.random()-.5)*80,(Math.random()-.5)*50,-150+Math.random()*170);stk.add(m)}

let ship = new THREE.Group();
let engLight;
function buildShip(shipData) {
    if(ship) S.remove(ship);
    ship = new THREE.Group();
    const mM = new THREE.MeshStandardMaterial({color: shipData.hullColor, metalness: .9, roughness: .25});
    const wM = new THREE.MeshStandardMaterial({color: shipData.wingColor, metalness: .8, roughness: .4});
    
    const add = (m,x,y,z) => {m.position.set(x,y,z);ship.add(m);return m};
    
    const bd = add(new THREE.Mesh(new THREE.ConeGeometry(.7,3.6,12),mM),0,0,0);
    bd.rotation.x = -Math.PI/2;
    
    // Wings
    const wGeo = new THREE.BoxGeometry(4.2, .08, 1.5);
    // Taper wings
    const pos = wGeo.attributes.position;
    for(let i=0; i<pos.count; i++) { if(pos.getZ(i) < 0) { pos.setX(i, pos.getX(i) * 0.4); } }
    wGeo.computeVertexNormals();
    add(new THREE.Mesh(wGeo, wM), 0, 0, .8);
    
    // Tail
    add(new THREE.Mesh(new THREE.BoxGeometry(.1, 1.2, 1.2), wM), 0, .5, .9);
    
    // Cockpit
    const ck = add(new THREE.Mesh(new THREE.SphereGeometry(.45,16,12),new THREE.MeshStandardMaterial({color:0x222222,emissive:0x112233,metalness:.9,roughness:.1})),0,.35,-.2);
    ck.scale.z = 1.6;
    
    // Engines
    const engG = new THREE.CylinderGeometry(.25, .35, .8, 12);
    engG.rotateX(Math.PI/2);
    add(new THREE.Mesh(engG, new THREE.MeshStandardMaterial({color: 0x333333})), -0.6, 0, 1.6);
    add(new THREE.Mesh(engG, new THREE.MeshStandardMaterial({color: 0x333333})), 0.6, 0, 1.6);
    
    // Engine Glow
    const engGlowM = new THREE.MeshBasicMaterial({color: shipData.engineColor});
    const eG1 = add(new THREE.Mesh(new THREE.SphereGeometry(.2,12,8), engGlowM), -0.6, 0, 1.9);
    const eG2 = add(new THREE.Mesh(new THREE.SphereGeometry(.2,12,8), engGlowM), 0.6, 0, 1.9);
    
    engLight = new THREE.PointLight(shipData.engineColor, 3, 15);
    engLight.position.z = 2.5;
    ship.add(engLight);
    
    ship.engineGlows = [eG1, eG2];
    
    S.add(ship);
}
buildShip(SHIPS[0]);

function tex(c){const k=document.createElement('canvas');k.width=256;k.height=128;const x=k.getContext('2d');x.fillStyle=c;x.fillRect(0,0,256,128);for(let i=0;i<160;i++){x.fillStyle=`rgba(${Math.random()<.5?'255,255,255':'0,0,0'},${Math.random()*.14})`;x.beginPath();x.arc(Math.random()*256,Math.random()*128,5+Math.random()*25,0,7);x.fill()}return new THREE.CanvasTexture(k)}

P.forEach((d,i)=>{
    const gr=new THREE.Group(),col=new THREE.Color(d.c);
    gr.add(new THREE.Mesh(new THREE.SphereGeometry(5,40,32),new THREE.MeshStandardMaterial({map:tex(d.c),emissive:col,emissiveIntensity:.08,roughness:.8})));
    // Atmosphere
    gr.add(new THREE.Mesh(new THREE.SphereGeometry(5.8,32,24),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.15,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false})));
    
    if(i==0){const r=new THREE.Mesh(new THREE.RingGeometry(7.5,11,64),new THREE.MeshBasicMaterial({color:col,side:2,transparent:true,opacity:.6}));r.rotation.x=1.9;gr.add(r)}
    
    const l=new THREE.PointLight(col,2,100);l.position.set(0,0,10);gr.add(l);
    gr.position.set(...d.pos);S.add(gr);d.g=gr;
    const e=document.createElement('div');e.className='lb';$('lab').appendChild(e);d.e=e
});

const alien=new THREE.Group(),aM=new THREE.MeshStandardMaterial({color:0x1a1c22,metalness:.9,roughness:.2});
const sc=new THREE.Mesh(new THREE.SphereGeometry(6,32,16),aM);sc.scale.y=.25;alien.add(sc);
const dm=new THREE.Mesh(new THREE.SphereGeometry(2.5,24,16),new THREE.MeshStandardMaterial({color:0x0a0505,emissive:0x440000,transparent:true,opacity:.9}));dm.position.y=1;alien.add(dm);
{const e=new THREE.Mesh(new THREE.BoxGeometry(3,.2,.3),new THREE.MeshBasicMaterial({color:0xff1100}));e.position.set(0,1,2.2);alien.add(e)}
for(let i=0;i<16;i++){const l=new THREE.Mesh(new THREE.SphereGeometry(.2,8,8),new THREE.MeshBasicMaterial({color:0xff2244}));l.position.set(Math.cos(i/16*6.28)*5.5,-.1,Math.sin(i/16*6.28)*5.5);alien.add(l)}
const al=new THREE.PointLight(0xff2222,3,50);alien.add(al);alien.visible=false;S.add(alien);

const beamG=new THREE.CylinderGeometry(.2,1.2,1,16);beamG.translate(0,.5,0);beamG.rotateX(Math.PI/2);
const beam=new THREE.Mesh(beamG,new THREE.MeshBasicMaterial({color:0xff1133,transparent:true,opacity:.8,blending:THREE.AdditiveBlending}));beam.visible=false;S.add(beam);

const mg=new THREE.IcosahedronGeometry(1,1),pa=mg.attributes.position;for(let i=0;i<pa.count;i++){const s=.75+Math.random()*.5;pa.setXYZ(i,pa.getX(i)*s,pa.getY(i)*s,pa.getZ(i)*s)}mg.computeVertexNormals();
const mMat=new THREE.MeshStandardMaterial({color:0x5a4a40,roughness:1,flatShading:true,emissive:0x221100,emissiveIntensity:.4});
const bgm=new THREE.SphereGeometry(.2,8,8),bMat=new THREE.MeshBasicMaterial({color:0x00ffff});
let met=[],bul=[],par=[];

function boom(p,c,n,sp){const m=new THREE.MeshBasicMaterial({color:c,transparent:true,blending:THREE.AdditiveBlending});for(let i=0;i<n;i++){const o=new THREE.Mesh(bgm,m);o.position.copy(p);o.scale.setScalar(.5+Math.random());S.add(o);par.push({o,v:new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).multiplyScalar(sp),l:1,m})}}

let talk=0,alarm=0,mode='reg',all=[],order=[],user={},res={},cur=null,qi=0,ammo=0,hull=100,ans=[],wave=null,near=null,wt=0,cd=0,shake=0,alt=1;
let subStatus = ''; // Track submission status

const keys={};
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code=='Space')e.preventDefault();if(e.code=='KeyE'&&mode=='hub'&&near)warp(near);if(e.code=='KeyE'&&mode=='intro'&&!talk&&Math.hypot(player.position.x,player.position.z+7)<6.5)say(1)});
addEventListener('keyup',e=>keys[e.code]=0);

function ui(h){
    const u = $('ui');
    u.style.opacity = 0;
    setTimeout(() => { u.innerHTML=h; u.style.opacity = 1; }, mode === 'reg' ? 0 : 150);
}
function hud(){$('hb').style.width=Math.max(0,hull)+'%';$('am').textContent=ammo}
function flash(c){const f=$('fl');f.style.background=c||'#c22';f.style.transition='none';f.style.opacity=.6;requestAnimationFrame(()=>{f.style.transition='opacity .6s';f.style.opacity=0})}

function selectChar(id) {
    selectedCharId = id;
    document.querySelectorAll('#charGrid .sel-card').forEach(el => el.classList.remove('active'));
    document.getElementById('char_' + id).classList.add('active');
    
    // Update player model in background immediately
    const charData = CHARACTERS.find(c => c.id === id);
    if(charData && bay.visible) {
        updatePersonColors(player, charData.suit, charData.color);
    }
}

function selectShip(id) {
    selectedShipId = id;
    document.querySelectorAll('#shipGrid .sel-card').forEach(el => el.classList.remove('active'));
    document.getElementById('ship_' + id).classList.add('active');
    
    // Update ship model in background
    const shipData = SHIPS.find(s => s.id === id);
    buildShip(shipData);
    if(bay.visible) {
        ship.visible = false;
        S.remove(dock);
        dock = ship.clone();
        dock.position.set(9,1.5,6);dock.rotation.y=-.7;dock.scale.setScalar(1.5);
        bay.add(dock);
        ship.visible = false;
    }
}

function reg(){
    let charHTML = '';
    CHARACTERS.forEach(c => {
        charHTML += `<div class="sel-card ${c.id===selectedCharId?'active':''}" id="char_${c.id}" onclick="selectChar('${c.id}')">
            <span class="icon">${c.icon}</span><div class="name">${c.name}</div><div class="desc">${c.desc}</div>
        </div>`;
    });
    
    let shipHTML = '';
    SHIPS.forEach(s => {
        shipHTML += `<div class="sel-card ${s.id===selectedShipId?'active':''}" id="ship_${s.id}" onclick="selectShip('${s.id}')">
            <span class="icon">${s.icon}</span><div class="name">${s.name}</div><div class="desc">${s.desc}</div>
        </div>`;
    });

    ui(`<div class="p"><h1>CFO Odyssey</h1><p>GALACTIC TREASURY BOARD — EXECUTIVE SELECTION.<br>Prove your rational judgment across three sectors. Survive the meteor barrages.</p>
<div style="display:flex; gap:12px;">
    <div style="flex:1"><label>Name</label><input id="rn" placeholder="Commander name"></div>
    <div style="flex:1"><label>ID Code (Optional)</label><input id="ra" placeholder="Alpha-Numeric"></div>
</div>
<label>Select Operative</label>
<div class="sel-grid" id="charGrid">${charHTML}</div>
<label>Select Interceptor</label>
<div class="sel-grid" id="shipGrid">${shipHTML}</div>
<button onclick="go()" style="font-size:18px; padding: 16px;">ENTER ORBITAL HUB</button></div>`);
}

function go(){
    const n=$('rn').value.trim();
    if(!n){$('rn').style.borderColor='#f55';return}
    user={n, id:$('ra').value, char: selectedCharId, ship: selectedShipId};
    
    const charData = CHARACTERS.find(c => c.id === selectedCharId);
    updatePersonColors(player, charData.suit, charData.color);
    
    const shipData = SHIPS.find(s => s.id === selectedShipId);
    buildShip(shipData);
    // recreate dock
    S.remove(dock);
    dock = ship.clone();
    dock.position.set(9,1.5,6);dock.rotation.y=-.7;dock.scale.setScalar(1.5);
    bay.add(dock);
    
    intro();
}

function toHub(){

function saveScoresToSheet(finalScore, isPass, bsAverages) {
    if (WEB_APP_URL === 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL') {
        console.log("No Web App URL provided. Skipping save.");
        subStatus = "Results displayed locally. Set Web App URL to save to cloud.";
        renderFinalVerdict(finalScore, isPass, bsAverages);
        return;
    }

    subStatus = `<div class="loader" style="display:inline-block;"></div> Transmitting data to Galactic Treasury Board...`;
    renderFinalVerdict(finalScore, isPass, bsAverages); // Re-render to show loader

    // Prepare data payload matching headers (timestamp handled by server)
    const payload = {
        name: user.n,
        id_code: user.id || 'N/A',
        character: CHARACTERS.find(c=>c.id===user.char)?.name || 'Unknown',
        ship: SHIPS.find(s=>s.id===user.ship)?.name || 'Unknown',
        final_score: finalScore.toFixed(2),
        status: isPass ? 'PASS' : 'FAIL',
        sunk_cost: (bsAverages['sunk'] || 0).toFixed(1),
        overconfidence: (bsAverages['over'] || 0).toFixed(1),
        herd_behaviour: (bsAverages['herd'] || 0).toFixed(1),
        anchoring: (bsAverages['anch'] || 0).toFixed(1),
        framing: (bsAverages['frame'] || 0).toFixed(1),
        disposition: (bsAverages['disp'] || 0).toFixed(1)
    };

    // Convert payload to form-urlencoded string for POST
    const formBody = Object.keys(payload).map(key => encodeURIComponent(key) + '=' + encodeURIComponent(payload[key])).join('&');

    fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formBody,
        mode: 'no-cors' // Required for basic Apps Script setup without complex CORS handling
    })
    .then(() => {
        // no-cors means we can't read response, assume success if promise resolves
        subStatus = `<span style="color:#7fbf8f">✔ Data transmission successful. Record secured.</span>`;
        renderFinalVerdict(finalScore, isPass, bsAverages);
    })
    .catch(error => {
        console.error('Error saving:', error);
        subStatus = `<span style="color:#e0605a">✖ Transmission failed. Data logged locally only.</span>`;
        renderFinalVerdict(finalScore, isPass, bsAverages);
    });
}

function renderFinalVerdict(finalScore, isPass, bsAverages) {
    const ks=Object.keys(res);
    const row=(l,m)=>`<div class="row"><span>${l}</span><div class="bar"><i style="width:${m/7*100}%;background:${m>=4.5?'#7fbf8f':'#e0605a'}"></i></div><span style="width:34px">${m.toFixed(1)}</span></div>`;
    
    let bars='',pos=[],neg=[];
    for(const k in bsAverages){
        const m=bsAverages[k];
        bars+=row(B[k][0],m);
        (m>=4.5?pos:neg).push(k);
    }
    
    const secs=P.filter(p=>res[p.k]).map(p=>row(p.s,res[p.k].avg)).join('');
    
    const t=isPass?`<h2 class="ok">Assessment Complete — Approved</h2><p>${user.n}, overall rationality <b>${finalScore.toFixed(1)}/7</b>. The Board approves your appointment. `+(pos.length?'Strengths: you '+pos.map(k=>B[k][1]).join('; ')+'. ':'')+(neg.length?'Blind spots to watch: you may '+neg.map(k=>B[k][2]).join('; ')+'.':'')+'</p>'
    :`<h2 class="no">Assessment Failed</h2><p>${res[cur.k].why=='hull'?'Vessel destroyed during assessment. ':'Intercepted by hostile forces. '}Overall rationality <b>${finalScore.toFixed(1)}/7</b> (needed 4.5, with no sector below 3.5). The Board rejects your application because you ${neg.length?neg.map(k=>B[k][2]).join('; '):'scored too low overall'}.</p>`;
    
    ui(`<div class="p dlg">${t}<p style="margin-top:10px; font-weight:bold;">Sector Performance</p>${secs}<p style="margin-top:10px; font-weight:bold;">Bias Profile</p>${bars}
    <div style="margin: 15px 0; padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid #334; font-family: 'IBM Plex Mono', monospace; font-size: 12px;">${subStatus}</div>
    <button onclick="location.reload()">PROCESS NEW CANDIDATE</button></div>`);
}

function verdict(){
    const bs={}, bsAverages={};
    all.forEach(x=>(bs[x.b]=bs[x.b]||[]).push(x.r));
    for(const k in bs){
        bsAverages[k] = bs[k].reduce((a,b)=>a+b)/bs[k].length;
    }
    const ks=Object.keys(res), finalScore=ks.reduce((t,k)=>t+res[k].avg,0)/ks.length;
    
    // Only trigger save if we completed all 3 sectors, OR if we died (which means game over)
    if(ks.length === 3 || res[cur.k].why === 'hull') {
        saveScoresToSheet(finalScore, cur.pass, bsAverages);
    } else {
        // Should rarely hit here unless debug quitting, but render just in case
        subStatus = '';
        renderFinalVerdict(finalScore, cur.pass, bsAverages);
    }
}

function person(suitC, skinC){

    const sMat=new THREE.MeshStandardMaterial({color:suitC,roughness:.7,metalness:.2});

    const add=(geo,mt,x,y,z)=>{const o=new THREE.Mesh(geo,mt);o.position.set(x,y,z);g.add(o); return o;};
    
    g.body = add(new THREE.CylinderGeometry(.45,.55,1.3,12),sMat,0,1,0);
    g.head = add(new THREE.SphereGeometry(.35,16,12),skMat,0,1.95,0);
    g.visor = add(new THREE.BoxGeometry(.5,.15,.25),new THREE.MeshBasicMaterial({color:0x44aaff}),0,2,.25);

        add(new THREE.CylinderGeometry(.15,.15,.8,8),sMat,.6,.5,0)

}

function updateNPC(npc, dt) {
    npc.timer -= dt;
    if(npc.timer <= 0) {
        // pick new target
        npc.target.set((Math.random()-0.5)*24, 0, (Math.random()-0.5)*30 + 5);
        npc.timer = 3 + Math.random() * 5;
    }
    
    const dist = npc.model.position.distanceTo(npc.target);
    if(dist > 0.5) {
        const dir = npc.target.clone().sub(npc.model.position).normalize();
        npc.model.position.addScaledVector(dir, npc.speed * dt);
        // smooth rotation
        const targetAngle = Math.atan2(dir.x, dir.z);
        let diff = targetAngle - npc.model.rotation.y;
        while(diff < -Math.PI) diff += Math.PI*2;
        while(diff > Math.PI) diff -= Math.PI*2;
        npc.model.rotation.y += diff * dt * 3;
        
        // walking animation
        const time = clk.elapsedTime * npc.speed * 3;
        npc.model.legs[0].position.z = Math.sin(time) * 0.3;
        npc.model.legs[1].position.z = Math.sin(time + Math.PI) * 0.3;
        npc.model.arms[0].rotation.x = Math.sin(time + Math.PI) * 0.3;
        npc.model.arms[1].rotation.x = Math.sin(time) * 0.3;
        npc.model.body.position.y = 1 + Math.abs(Math.sin(time*2)) * 0.05;
    } else {
        // reset limbs when idle
        npc.model.legs[0].position.z = 0; npc.model.legs[1].position.z = 0;
        npc.model.arms[0].rotation.x = 0; npc.model.arms[1].rotation.x = 0;
    }
}
